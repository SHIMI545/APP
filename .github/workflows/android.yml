name: Android APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aureon-android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aureon-build-log
          path: build.log
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aureon-Music-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
