name: Nagen Android APK
on:
  push:
    branches: ["main"]
    paths:
      - "nagen/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/nagen.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nagen-android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Nagen release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :nagen:assembleRelease --no-daemon 2>&1 | tee nagen-build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> nagen-build.log
      - name: Upload Nagen build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nagen-build-log
          path: nagen-build.log
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload Nagen APK
        uses: actions/upload-artifact@v4
        with:
          name: Nagen-release
          path: nagen/build/outputs/apk/release/nagen-release.apk
          if-no-files-found: error
