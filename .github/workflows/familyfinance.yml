name: Family Finance Android APK
on:
  push:
    branches: ["main"]
    paths:
      - "familyfinance/**"
      - "settings.gradle.kts"
      - ".github/workflows/familyfinance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: familyfinance-android-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Family Finance release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :familyfinance:assembleRelease --no-daemon 2>&1 | tee familyfinance-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Family-Finance-build-log
          path: familyfinance-build.log
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Family-Finance-release
          path: familyfinance/build/outputs/apk/release/familyfinance-release.apk
          if-no-files-found: error
